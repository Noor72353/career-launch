[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-launch-utils"
version = "0.1.0"
description = "A simple command-line utility tool built during the Career Launch roadmap"
requires-python = ">=3.13"

[tool.setuptools]
py-modules = ["utils"]

[project.scripts]
career-utils = "utils:main"
